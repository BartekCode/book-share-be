spring:
  application:
    name: app
  servlet:
    multipart:
      max-file-size: 1MB
  cloud:
    azure:
      keyvault:
        secret:
          enabled: true
          endpoint: https://book-share.vault.azure.net/
  thymeleaf:
    prefix: classpath:templates/
    suffix: .html
  mail:
    host: smtp.gmail.com
    port: 587
    username: 
    password: "**"
    properties:
      mail:
        smtp:
          trust: "*"
          starttls:
            enable: true
          ssl:
            trust: smtp.gmail.com
          auth: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  datasource:
    url: jdbc:postgresql://book-share-db.postgres.database.azure.com:5432/booksharedb?sslmode=require
    username: 
    password: 
    hikari:
      minimum-idle: 5
      maximum-pool-size: 10
    driver-class-name: org.postgresql.Driver
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
  threads:
    virtual:
      enabled: true

mail:
  from: "bookshare@gmail.com"
  activationUrl: https://black-glacier-050ecbf03.2.azurestaticapps.net/activate-account

security:
  frontend:
    url: https://black-glacier-050ecbf03.2.azurestaticapps.net/
  activationCodeExpireTime: 120
  jwt:
    secretKey: zFwPKYRM4OFeVtMRHoLPbSxi6zbyj5rwMHCPzEELh3I=
    expiration: 86400000

logging:
  level:
    liquibase: DEBUG
    liquibase.changelog: DEBUG
