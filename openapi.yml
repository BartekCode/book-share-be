      operationId: removeBook_1
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
components:
  schemas:
    UserRegisterRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
          maxLength: 2147483647
          minLength: 6
        email:
          type: string
      required:
        - email
        - password
        - username
    UserRegisterResponse:
      type: object
      properties:
        userId:
          type: string
    UserLoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
    BookResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        author:
          type: string
        imageUrl:
          type: string
        description:
          type: string
        dateAdded:
          type: string
          format: date
        genre:
          type: string
          enum:
            - Fiction
            - NonFiction
            - Mystery
            - Fantasy
            - ScienceFiction
            - Science
            - Biography
            - History
            - Romance
            - Thriller
            - Horror
            - Undefined
            - Tech
        comments:
          type: array
          items:
            type: string
        likesNumber:
          type: integer
          format: int32
        isBorrowed:
          type: boolean
    UserDataResponse:
      type: object
      properties:
        userId:
          type: string
        username:
          type: string
        email:
          type: string
        userBooks:
          type: array
          items:
            $ref: "#/components/schemas/BookResponse"
        borrowedBooks:
          type: array
          items:
            $ref: "#/components/schemas/BookResponse"
        readBooks:
          type: array
          items:
            $ref: "#/components/schemas/BookResponse"
        likedBooks:
          type: array
          items:
            $ref: "#/components/schemas/BookResponse"
    BookCreateRequest:
      type: object
      properties:
        title:
          type: string
        author:
          type: string
        imageUrl:
          type: string
        description:
          type: string
        genre:
          type: string
          enum:
            - Fiction
            - NonFiction
            - Mystery
            - Fantasy
            - ScienceFiction
            - Science
            - Biography
            - History
            - Romance
            - Thriller
            - Horror
            - Undefined
            - Tech
        userId:
          type: string
    BookBorrowResponse:
      type: object
      properties:
        bookId:
          type: string
        userId:
          type: string
        message:
          type: string
        imageUrl:
          type: string
        username:
          type: string
