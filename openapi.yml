      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: requestUserId
          in: query
          required: true
          schema:
            type: string
        - name: ownerUserId
          in: query
          required: true
          schema:
            type: string
        - name: isAccepted
          in: query
          required: true
          schema:
            type: boolean
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: integer
                format: int64
  /v1/user/register:
    post:
      tags:
