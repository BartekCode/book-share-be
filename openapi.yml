  /v1/book/all:
    get:
      tags:
        - book-controller
      operationId: getAllBooks
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 1
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
